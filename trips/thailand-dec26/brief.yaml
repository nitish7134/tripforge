# tripforge brief · Thailand, Dec 2026 – Jan 2027
# Status: NOTHING DECIDED. This brief feeds the options menu; a plan brief gets written once a combo is picked.

destination: Thailand
from_airport: BLR
people: 2                     # Nitish + Suparth
window:
  preferred_start: 2026-12-24 # Akasa/IndiGo out on the 24th was the friend's first idea
  alternatives: [2026-12-13, 2026-12-20, 2026-12-21, 2026-12-28, 2027-01-09]
  nights: 7-10                # 2 weekends + 5 leave days ≈ 10-11 days possible
  leave_days_max: 6
flights:
  nonstop_only: true
  max_total_hours_if_stop: 6
  cabin_only: true            # skip checked bags unless cheap
stays:
  budget_per_night_inr: 5000  # for the room, two sharing; a bit above/below OK
  hostels_ok: true            # a few nights in cities to save; private rooms on party-recovery nights
  min_rating: 4.6
  min_reviews: 10
food: veg                     # all vegetarian
rates:
  per_meal_inr: 1000
  per_party_night_inr: 2500
preferences:
  party: high                 # clubs, drinks, beach parties
  scenery: high
  culture: medium
  frugal: "cheapest option that keeps the experience, never the cheapest thing"
optional_cards:               # all of these are OPTIONS, none mandatory
  - Bangkok
  - Chiang Mai (+Pai)
  - Pattaya
  - Phuket (Patong/Kata)
  - Krabi / Railay
  - Koh Phangan Full Moon Party (31 Dec)
  - Koh Samui / Koh Tao
  - Koh Lanta / Khao Sok
must_consider:
  - Christmas vs New Year abroad, or neither
  - Where is NYE (Bangkok countdown / beach / Full Moon)
  - Railay day if Krabi is in
currency: INR
passport: IN
