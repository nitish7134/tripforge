[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripforge"
version = "0.2.0"
description = "Minimal-input trip planner: live flights, stays, visa/FX/advisory/climate, photos -> designed HTML + PNG plan"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["playwright>=1.45", "httpx>=0.27", "jinja2>=3.1", "pillow>=10", "rich>=13", "typer>=0.12", "pyyaml>=6",
  # fli main: PyPI 0.9.0 predates the 2026-09 page-GET fix and returns nothing
  "flights @ git+https://github.com/punitarani/fli.git@881aee5ff4321e81ea2157cb44be94ce6a21dc1b",
  # pyairbnb main: carries the api-key redirect fix (#63) that PyPI 2.2.2 lacks
  "pyairbnb @ git+https://github.com/johnbalvin/pyairbnb.git@1ee4151d7fcc2fc02dca1985753b67b0d45b2877",
  "pytest>=8"]

[project.scripts]
tripforge = "tripforge.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tripforge"]
