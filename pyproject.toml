[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripforge"
version = "0.1.0"
description = "Minimal-input trip planner: live flights, stays, visa/FX/advisory/climate, photos -> designed HTML + PNG plan"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["playwright>=1.45", "httpx>=0.27", "jinja2>=3.1", "pillow>=10", "rich>=13", "typer>=0.12"]

[project.scripts]
tripforge = "tripforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tripforge"]
